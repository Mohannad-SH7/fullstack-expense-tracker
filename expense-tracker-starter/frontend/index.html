<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <!-- ==================== Navbar ==================== -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> Expense Tracker </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#"> Dashboard </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ==================== Main ==================== -->
    <main class="container py-4" id="alertContainer">
      <!-- Header -->
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4"
      >
        <div>
          <h1 class="fw-bold mb-1">Expense Dashboard</h1>

          <p class="text-muted mb-0">Track and manage your expenses</p>
        </div>

        <button
          class="btn btn-primary mt-3 mt-md-0"
          data-bs-toggle="modal"
          data-bs-target="#addExpenseModal"
        >
          + Add Expense
        </button>
      </div>

      <!-- ==================== Summary Cards ==================== -->
      <div class="row g-3 mb-4">
        <!-- Total Expenses -->
        <div class="col-12 col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <h6 class="text-muted">Total Expenses</h6>

              <h2 class="fw-bold mb-0" id="totalExpenses">0</h2>
            </div>
          </div>
        </div>

        <!-- Number of Expenses -->
        <div class="col-12 col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <h6 class="text-muted">Total Amount</h6>

              <h2 class="fw-bold mb-0" id="totalAmount">$0.00</h2>
            </div>
          </div>
        </div>

        <!-- Highest Expense -->
        <div class="col-12 col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <h6 class="text-muted">Highest Expense</h6>

              <h2 class="fw-bold mb-0" id="highestExpenses">$0.00</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== Expenses Section ==================== -->
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <!-- Table Header -->
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-3"
          >
            <div>
              <h4 class="fw-bold mb-1">Expenses</h4>

              <p class="text-muted mb-0">Your recent expenses</p>
            </div>

            <!-- Filter -->
            <div class="mt-3 mt-md-0">
              <select id="categoryFilter" class="form-select">
                <option value="all">All Categories</option>

                <option value="Food">Food</option>

                <option value="Transport">Transport</option>

                <option value="Bills">Bills</option>

                <option value="Entertainment">Entertainment</option>

                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <!-- ==================== Alert ==================== -->
          <div id="alertMessage" class="alert alert-danger d-none" role="alert">
            Something went wrong.
          </div>

          <!-- ==================== Spinner ==================== -->
          <div id="loadingSpinner" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden"> Loading... </span>
            </div>

            <p class="text-muted mt-2 mb-0">Loading expenses...</p>
          </div>

          <!-- ==================== Table ==================== -->
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>

              <tbody id="expensesTableBody">
                <!--JavaScript will add expenses here.-->
              </tbody>
            </table>
          </div>

          <!-- Empty State -->
          <div id="emptyState" class="text-center py-5"></div>
        </div>
      </div>
    </main>

    <!-- ================================================== -->
    <!-- Add Expense Modal -->
    <!-- ================================================== -->

    <div
      class="modal fade"
      id="addExpenseModal"
      tabindex="-1"
      aria-labelledby="addExpenseModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addExpenseModalLabel">Add Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="expenseForm">
              <!-- Title -->
              <div class="mb-3">
                <label for="title" class="form-label"> Title </label>

                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  placeholder="Example: Lunch"
                  required
                />
              </div>

              <!-- Amount -->
              <div class="mb-3">
                <label for="amount" class="form-label"> Amount </label>

                <input
                  type="number"
                  class="form-control"
                  id="amount"
                  name="amount"
                  placeholder="Example: 4.50"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <!-- Category -->
              <div class="mb-3">
                <label for="category" class="form-label"> Category </label>

                <select
                  class="form-select"
                  id="category"
                  name="category"
                  required
                >
                  <option value="">Select category</option>

                  <option value="Food">Food</option>

                  <option value="Transport">Transport</option>

                  <option value="Bills">Bills</option>

                  <option value="Entertainment">Entertainment</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- Date -->
              <div class="mb-3">
                <label for="date" class="form-label"> Date </label>

                <input
                  type="date"
                  class="form-control"
                  id="date"
                  name="date"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="submit"
              id="saveExpenseBtn"
              form="expenseForm"
              class="btn btn-primary"
            >
              Add Expense
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================== -->
    <!-- Edit Expense Modal -->
    <!-- ================================================== -->

    <div
      class="modal fade"
      id="editExpenseModal"
      tabindex="-1"
      aria-labelledby="editExpenseModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editExpenseModalLabel">Edit Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="editExpenseForm">
              <!-- Hidden ID -->
              <input type="hidden" id="editId" />

              <!-- Title -->
              <div class="mb-3">
                <label for="editTitle" class="form-label"> Title </label>

                <input
                  type="text"
                  class="form-control"
                  id="editTitle"
                  required
                />
              </div>

              <!-- Amount -->
              <div class="mb-3">
                <label for="editAmount" class="form-label"> Amount </label>

                <input
                  type="number"
                  class="form-control"
                  id="editAmount"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <!-- Category -->
              <div class="mb-3">
                <label for="editCategory" class="form-label"> Category </label>

                <select class="form-select" id="editCategory" required>
                  <option value="Food">Food</option>

                  <option value="Transport">Transport</option>

                  <option value="Bills">Bills</option>

                  <option value="Entertainment">Entertainment</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- Date -->
              <div class="mb-3">
                <label for="editDate" class="form-label"> Date </label>

                <input
                  type="date"
                  class="form-control"
                  id="editDate"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="submit"
              form="editExpenseForm"
              id="editExpenseBtn"
              class="btn btn-primary"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
